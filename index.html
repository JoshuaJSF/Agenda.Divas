<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Divas</title>
<style>
:root{--p-bg:#fbf4f6;--p-tx:#3a2530;--p-mu:#8a6f7c;--p-ln:#ecd9e0;--p-hd:#b5627f;--p-ac:#c4688b;--p-acs:#f8e3ea;--bg:var(--p-bg);--sf:#fff;--tx:var(--p-tx);--mu:var(--p-mu);--ln:var(--p-ln);--hd:var(--p-hd);--ac:var(--p-ac);--acs:var(--p-acs);--pe:#ffeab5;--fi:#e6dcf3;--co:#cdeedd;--bl:#f4a9ae;--off:#e6d9de}
:root[data-pal="lilas"]{--p-bg:#f7f3fb;--p-tx:#2f2540;--p-mu:#7b6e8f;--p-ln:#e1d6ee;--p-hd:#8e6bb5;--p-ac:#9a74c4;--p-acs:#eadff7}
:root[data-pal="nude"]{--p-bg:#fbf6f2;--p-tx:#3b2b25;--p-mu:#8c7468;--p-ln:#eadccf;--p-hd:#b08a76;--p-ac:#b8806a;--p-acs:#f6e8df}
:root[data-pal="coral"]{--p-bg:#fff6f2;--p-tx:#402a26;--p-mu:#946f66;--p-ln:#f2dcd3;--p-hd:#e0836b;--p-ac:#e07a62;--p-acs:#fde4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#221a1f;--sf:#2c2228;--tx:#f5e9ef;--mu:#bda5b1;--ln:#463640;--acs:#4a3340;--pe:#6e5a22;--fi:#4d3f6b;--co:#2c5e48;--bl:#8f3f49;--off:#43363d}}
:root[data-theme="dark"]{--bg:#221a1f;--sf:#2c2228;--tx:#f5e9ef;--mu:#bda5b1;--ln:#463640;--acs:#4a3340;--pe:#6e5a22;--fi:#4d3f6b;--co:#2c5e48;--bl:#8f3f49;--off:#43363d}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.3 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;height:100%}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:10px;overflow:auto}
main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:8px}
.top h1{font-size:17px;margin:0;font-weight:600;text-align:center;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.nav{background:none;border:0;color:#fff;font-size:22px;padding:0 8px}
.mini{background:var(--ac);color:#fff;border-radius:4px;padding:4px;margin-bottom:8px}
.mh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;padding:2px 4px}
.mh button{background:none;border:0;color:#fff;font-size:16px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);background:var(--sf);color:var(--tx);border-radius:3px;margin-top:3px;text-align:center;font-size:12px}
.mg span{padding:3px 0;cursor:pointer}.mg .w{color:var(--mu);cursor:default;font-size:11px}.mg .o{color:var(--mu);opacity:.5}
.mg .t{outline:1px solid var(--ac);border-radius:50%}.mg .s{background:var(--ac);color:#fff;border-radius:50%}
.hoje{width:100%;background:var(--ac);color:#fff;border:0;border-radius:3px;padding:3px;font-size:12px;margin-bottom:8px;font-weight:600}
.act{display:flex;align-items:center;gap:10px;width:100%;background:var(--acs);border:0;border-bottom:2px solid var(--sf);padding:9px 10px;text-align:left}
.act:hover{filter:brightness(.96)}.act:disabled{opacity:.45;cursor:default}
.info{background:var(--acs);padding:8px 10px;margin:8px 0;min-height:84px;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}.leg i{width:20px;height:20px;border:1px solid var(--ln);display:inline-block}
.wrap{flex:1;overflow:auto;position:relative;background:var(--sf)}
.grid{display:grid;width:max-content;min-width:100%}
.hrow{display:contents}
.hc{position:sticky;top:0;z-index:5;background:var(--acs);border:1px solid var(--ln);padding:6px 4px;text-align:center;font-weight:600;font-size:13px;height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner{left:0;z-index:7}
.tc{position:sticky;left:0;z-index:4;background:var(--acs);border-right:1px solid var(--ln)}
.tl{height:26px;padding:0 6px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--ln);display:flex;align-items:center}
.tl.h{color:var(--tx);font-weight:600}
.col{position:relative;border-right:1px solid var(--ln);min-width:130px;background:repeating-linear-gradient(to bottom,transparent 0 25px,var(--ln) 25px 26px)}
.col.sel .cell{}
.cell{position:absolute;left:0;right:0;height:26px;cursor:pointer}
.cell:hover{background:var(--acs)}.cell.pick{outline:2px dotted var(--ac);outline-offset:-2px}
.off{position:absolute;left:0;right:0;background:var(--off);opacity:.8;pointer-events:none}
.ap{position:absolute;left:1px;right:1px;border:0;border-radius:2px;padding:2px 5px;text-align:left;overflow:hidden;z-index:2;color:#1d2733;font-size:13px;line-height:1.2}
.ap small{display:block;text-transform:uppercase;font-size:11px;opacity:.7}
.ap.pendente{background:var(--pe)}.ap.finalizado{background:var(--fi)}.ap.confirmado{background:var(--co)}.ap.bloqueado{background:var(--bl)}
:root[data-theme="dark"] .ap,@media (prefers-color-scheme:dark){.ap{color:#f1f4f8}}
.ap.on{outline:2px solid var(--ac);z-index:3}
.now{position:absolute;left:0;right:0;height:2px;background:#e23b3b;z-index:3;pointer-events:none}
dialog{border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);padding:18px;width:min(380px,92vw)}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
input,select{width:100%;padding:7px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--tx);font:inherit;margin-top:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.btns button{padding:7px 14px;border-radius:5px;border:1px solid var(--ln);background:var(--bg)}
.btns{flex-wrap:wrap}.btns #bd{margin-right:auto;color:#c0392b}.btns .pri{background:var(--ac);color:#fff;border-color:var(--ac)}
dialog{max-height:92vh;overflow:auto}.xr{border-top:1px dashed var(--ln);margin-top:10px;padding-top:2px}.xt{display:block;padding:8px 0}.xrm{background:none;border:0;color:#c0392b;padding:4px 0;font-size:12px}.addx{margin-top:10px;width:100%;padding:8px;border:1px dashed var(--ac);background:none;color:var(--ac);border-radius:5px}
#dg2{width:min(460px,94vw)}.lst{display:flex;flex-direction:column;max-height:34vh;overflow:auto;border:1px solid var(--ln);border-radius:4px;margin:8px 0}.it{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid var(--ln);background:var(--bg);width:100%}button.it:hover{background:var(--acs)}.it span,.mu{color:var(--mu);font-size:12px}.mu{padding:8px 10px;margin:0}dialog h3{font-size:14px;margin:12px 0 0}
.top h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:.04em}.pal{display:flex;gap:8px;margin-top:14px;align-items:center;font-size:13px}.pal button{width:26px;height:26px;border-radius:50%;border:2px solid var(--sf);outline:1px solid var(--ln)}.pal button.on{outline:2px solid var(--tx)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:1px solid var(--ln);max-height:44vh}.col,.hc{min-width:112px}}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.ac{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:26px;width:min(380px,100%);box-shadow:0 8px 30px #0001}
.ac h1{font:600 26px Georgia,"Times New Roman",serif;margin:0 0 4px;color:var(--hd);text-align:center}
.as{margin:0 0 10px;text-align:center;color:var(--mu);font-size:13px}
.ac .pri{width:100%;margin-top:16px;padding:10px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-weight:600}
.ac .pri:disabled{opacity:.6}
.lk{display:block;margin:12px auto 0;background:none;border:0;color:var(--ac);text-decoration:underline}
.am{min-height:18px;margin:10px 0 0;text-align:center;font-size:13px;color:var(--mu)}
.usr{margin-top:14px;padding-top:10px;border-top:1px solid var(--ln);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.usr button{padding:5px 12px;border:1px solid var(--ln);border-radius:5px;background:var(--bg)}
.rec .ownly{display:none!important}.rec .mv{display:none}
.it[draggable]{cursor:grab}.it.drop{outline:2px dashed var(--ac);outline-offset:-2px}.mv{cursor:pointer;padding:0 7px;font-style:normal;color:var(--ac)}
.hcp{cursor:pointer}.hcp:hover{filter:brightness(.95)}
.aus{position:absolute;left:0;right:0;top:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(45deg,var(--off) 0 8px,transparent 8px 16px);display:flex;justify-content:center;align-items:flex-start;padding-top:8px}
.aus span{background:var(--sf);border:1px solid var(--ln);padding:2px 10px;border-radius:10px;font-size:12px;position:sticky;top:44px}
</style>
</head>
<body>
<div id="auth"><form class="ac" id="aform" novalidate>
<h1>Agenda Divas</h1><p class="as" id="as">Acesse com seu usuário e senha</p>
<label id="ael">Usuário<input id="ae" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
<label id="apl"><span id="apt">Senha</span><input id="ap" type="password" autocomplete="current-password"></label>
<label id="ap2l" style="display:none">Repita a nova senha<input id="ap2" type="password" autocomplete="new-password"></label>
<button class="pri" id="ab" type="submit">Entrar</button>
<button type="button" class="lk" id="af">Esqueci minha senha</button>
<p id="am" class="am" role="alert"></p></form></div>
<div class="app">
<aside>
  <div class="mini"><div class="mh"><button id="mp" aria-label="Mês anterior">‹</button><span id="mt"></span><button id="mn" aria-label="Próximo mês">›</button></div><div class="mg" id="mg"></div></div>
  <button class="hoje" id="hoje">IR PARA HOJE</button>
  <button class="act" id="aInc">＋ Incluir</button>
  <button class="act" id="aAlt">✎ Alterar</button>
  <button class="act" id="aDet">☰ Detalhes</button>
  <button class="act" id="aCan">✕ Cancelar</button>
  <button class="act" id="aFin">✓ Finalizar</button>
  <button class="act" id="aBus">⌕ Buscar</button>
  <button class="act" id="aSv">✂ Serviços</button>
  <button class="act" id="aCl">☺ Clientes</button>
  <button class="act" id="aPr">♛ Profissionais</button>
  <button class="act ownly" id="aBk">⇩ Backup</button>
  <div class="info" id="info"></div>
  <div class="leg">
    <div><i style="background:var(--pe)"></i>Pendente</div><div><i style="background:var(--fi)"></i>Finalizado</div>
    <div><i style="background:var(--co)"></i>Confirmado</div><div><i style="background:var(--bl)"></i>Horário bloqueado</div>
  </div>
<div class="pal" id="pal"></div>
  <div class="usr"><span id="un"></span><button id="lo">Sair</button></div>
</aside>
<main>
  <div class="top"><button class="nav" id="dp" aria-label="Dia anterior">◀</button><h1 id="tt"></h1><button class="nav" id="dn" aria-label="Próximo dia">▶</button></div>
  <div class="wrap" id="wrap"><div class="grid" id="grid"></div></div>
</main>
</div>

<dialog id="dlg">
  <h2 id="dh">Novo agendamento</h2>
  <label>Cliente<input id="fc" list="cl" autocomplete="off"></label>
  <label>Serviço<input id="fs" list="sv" autocomplete="off"></label>
  <datalist id="sv"></datalist><datalist id="cl"></datalist>
  <label>Profissional<select id="fp"></select></label>
  <div class="row"><label>Horário<select id="fh"></select></label><label>Duração<select id="fd"></select></label></div>
  <div id="ex"></div><button class="addx" id="bad">+ Adicionar outro serviço</button>
  <label>Situação<select id="fst"><option value="pendente">Pendente</option><option value="confirmado">Confirmado</option><option value="finalizado">Finalizado</option><option value="bloqueado">Horário bloqueado</option></select></label>
  <div class="btns"><button id="bd">Cancelar atendimento</button><button id="bf">Finalizar</button><button id="bx">Fechar</button><button class="pri" id="bs">Salvar</button></div>
</dialog>
<dialog id="dg3"><p id="q3" style="margin:0 0 8px;font-size:15px"></p><input id="qi"><div class="btns"><button id="qno">Voltar</button><button class="pri" id="qok">Confirmar</button></div></dialog>
<dialog id="dg2"><div id="p2"></div></dialog>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
let PROFS=[],PU=[],AUS=[];
const START=8*60,END=22*60,STEP=15,H=26;
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIA=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const $=id=>document.getElementById(id);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let today=new Date(),cur=new Date(today.getFullYear(),today.getMonth(),today.getDate()),view=new Date(cur),appts=[],selA=null,selS=null,editId=null;
const today0=key(today);
const save=()=>queue();
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}

function render(){
  $("tt").textContent=DIA[cur.getDay()].toUpperCase()+" | "+cur.getDate()+" DE "+MES[cur.getMonth()].toUpperCase()+" | "+cur.getFullYear();
  const g=$("grid");g.style.gridTemplateColumns=PROFS.length?"64px repeat("+PROFS.length+",minmax(130px,1fr))":"1fr";
  let h='<div class="hc corner tc"></div>'+PROFS.map((p,i)=>'<div class="hc hcp" data-pi="'+i+'" title="Clique para marcar ausência">'+esc(p)+(absOn(i,key(cur))?' · ausente':'')+'</div>').join("");
  const rows=(END-START)/STEP;
  let tl="";for(let i=0;i<rows;i++){const m=START+i*STEP;tl+='<div class="tl'+(m%60==0?" h":"")+'">'+hm(m)+'</div>'}
  h+='<div class="tc">'+tl+'</div>';
  const k=key(cur);
  PROFS.forEach((p,pi)=>{
    let c='<div class="col" data-p="'+pi+'" style="height:'+rows*H+'px">';const ab=absOn(pi,k);if(ab)c+='<div class="aus" style="height:'+rows*H+'px"><span>Ausente'+(ab.motivo?' · '+esc(ab.motivo):'')+'</span></div>';
    lanes(appts.filter(a=>a.status!="cancelado"&&a.date==k&&a.prof==pi)).forEach(({a,l,n})=>{
      c+='<button class="ap '+a.status+(a.id==selA?" on":"")+'" data-id="'+a.id+'" style="top:'+(a.start-START)/STEP*H+'px;height:'+a.dur/STEP*H+'px;left:calc((100% - 14px)*'+l+'/'+n+' + 1px);width:calc((100% - 14px)/'+n+' - 2px);right:auto"><b>'+esc(a.client||(a.status=="bloqueado"?"Bloqueado":""))+'</b><small>'+esc(a.service)+'</small></button>'});
    if(selS&&selS.p==pi)c+='<div class="cell pick" style="top:'+(selS.m-START)/STEP*H+'px"></div>';
    if(k==today0){const n=today.getHours()*60+today.getMinutes();if(n>=START&&n<END&&pi==0)c+='';}
    g.dataset.k=k;h+=c+'</div>'});
  g.innerHTML=PROFS.length?h:'<div style="padding:28px;color:var(--mu);max-width:460px;line-height:1.5">Nenhum profissional cadastrado ainda.<br>Use o botão <b>Profissionais</b> para cadastrar ou <b>Backup → Restaurar</b> para trazer seus dados antigos.</div>';
  if(PROFS.length&&k==today0){const n=today.getHours()*60+today.getMinutes();if(n>=START&&n<END){const l=document.createElement("div");l.className="now";l.style.top=(32+(n-START)/STEP*H)+"px";l.style.gridColumn="1/-1";l.style.position="absolute";l.style.left="0";g.style.position="relative";g.appendChild(l)}}
  renderMini();renderInfo();
}
function renderMini(){
  $("mt").textContent=MES[view.getMonth()]+" de "+view.getFullYear();
  let h=["dom","seg","ter","qua","qui","sex","sáb"].map(d=>'<span class="w">'+d+'</span>').join("");
  const f=new Date(view.getFullYear(),view.getMonth(),1);
  for(let i=0;i<42;i++){const d=new Date(f);d.setDate(1-f.getDay()+i);
    const cls=(d.getMonth()!=view.getMonth()?"o ":"")+(key(d)==today0?"t ":"")+(key(d)==key(cur)?"s":"");
    h+='<span class="'+cls+'" data-d="'+key(d)+'">'+d.getDate()+'</span>'}
  $("mg").innerHTML=h;
}
function renderInfo(){
  const a=appts.find(x=>x.id==selA);
  if(a)$("info").innerHTML="<b>Horário:</b> "+hm(a.start)+" – "+hm(a.start+a.dur)+"<br><b>"+esc(PROFS[a.prof])+"</b><br>"+esc(a.client)+" · "+esc(a.service)+"<br>Situação: "+a.status.toUpperCase()+(priceOf(a.service)?"<br>"+money(priceOf(a.service)):"");
  else if(selS)$("info").innerHTML="<b>Horário:</b> "+hm(selS.m)+"<br><b>"+esc(PROFS[selS.p])+"</b><br>Situação: DISPONÍVEL";
  else $("info").innerHTML="Toque em um horário livre para agendar. Para marcar outro cliente no mesmo horário, toque na faixa à direita do atendimento.";
  ["aAlt","aDet","aCan","aFin"].forEach(i=>$(i).disabled=!a);
  $("aInc").disabled=!selS&&!a;
}
function setDate(d){cur=new Date(d.getFullYear(),d.getMonth(),d.getDate());view=new Date(cur);selA=null;selS=null;render()}
$("dp").onclick=()=>{const d=new Date(cur);d.setDate(d.getDate()-1);setDate(d)};
$("dn").onclick=()=>{const d=new Date(cur);d.setDate(d.getDate()+1);setDate(d)};
$("hoje").onclick=()=>setDate(new Date());
$("mp").onclick=()=>{view.setMonth(view.getMonth()-1);renderMini()};
$("mn").onclick=()=>{view.setMonth(view.getMonth()+1);renderMini()};
$("mg").onclick=e=>{const d=e.target.dataset.d;if(d){const[y,m,dd]=d.split("-");setDate(new Date(+y,m-1,+dd))}};

$("grid").onclick=async e=>{const hp=e.target.closest(".hcp");if(hp){showAus(+hp.dataset.pi);return}
  const ap=e.target.closest(".ap");
  if(ap){selA=+ap.dataset.id;selS=null;render();openDlg(selA);return}
  const col=e.target.closest(".col");
  if(col){const r=col.getBoundingClientRect();const m=START+Math.floor((e.clientY-r.top)/H)*STEP;
    if(absOn(+col.dataset.p,key(cur))&&!await ask(PROFS[+col.dataset.p]+" está ausente neste dia. Agendar mesmo assim?"))return;
    selS={p:+col.dataset.p,m};selA=null;render();openDlg(null)}
};

function fillSelects(){
  $("fp").innerHTML=PROFS.map((p,i)=>'<option value="'+i+'">'+esc(p)+'</option>').join("");
  let o="";for(let m=START;m<END;m+=STEP)o+='<option value="'+m+'">'+hm(m)+'</option>';$("fh").innerHTML=o;
  o="";for(let d=15;d<=300;d+=15)o+='<option value="'+d+'">'+(d>=60?Math.floor(d/60)+"h":"")+(d%60?(d%60)+"min":"")+'</option>';$("fd").innerHTML=o;
}
function openDlg(id){
  editId=id;const a=appts.find(x=>x.id==id);
  $("dh").textContent=a?"Alterar agendamento":"Novo agendamento";
  $("fc").value=a?a.client:"";$("fs").value=a?a.service:"";
  const r0=a||(selS?{prof:selS.p,start:selS.m}:appts.find(x=>x.id==selA));$("fp").value=r0?r0.prof:0;$("fh").value=r0?r0.start:600;
  $("fd").value=a?a.dur:60;$("fst").value=a?a.status:"pendente";
  $("bd").style.display=$("bf").style.display=a?"":"none";
  extras=[];drawExtra();$("bad").style.display=a?"none":"";
  $("dlg").showModal();if(!a)$("fc").focus();
}
$("aInc").onclick=()=>openDlg(null);
$("aAlt").onclick=()=>openDlg(selA);
$("aDet").onclick=()=>openDlg(selA);
$("bx").onclick=()=>$("dlg").close();

  try{
    if(amode==='login'){if(!em||!pw)throw new Error('Informe usuário e senha.');const{error}=await sb.auth.signInWithPassword({email:toMail(em),password:pw});if(error)throw new Error('E-mail ou senha incorretos.')}
    else if(amode==='reset'){if(!em)throw new Error('Informe seu e-mail.');const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)throw error;$('am').textContent='Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.'}
    else{if(pw.length<8)throw new Error('A senha precisa ter ao menos 8 caracteres.');if($('ap2').value!==pw)throw new Error('As senhas não conferem.');const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;RECOV=false;history.replaceState(null,'',location.pathname);$('ap2').value='';const{data}=await sb.auth.getSession();boot(data.session)}
  }catch(err){$('am').textContent=err.message}
  $('ab').disabled=false};
async function boot(s){
  if(!s){setMode('login');return}
  $('am').textContent='Carregando…';
  const{data:pf,error}=await sb.from('profiles').select('nome,role,ativo').eq('id',s.user.id).maybeSingle();
  if(error||!pf||!pf.ativo){await sb.auth.signOut();setMode('login','Seu usuário não tem acesso ao sistema. Fale com a proprietária.');return}
  ME={uid:s.user.id,nome:pf.nome,role:pf.role};document.body.classList.toggle('rec',pf.role!=='proprietaria');
  try{await loadAll()}catch(e){await sb.auth.signOut();setMode('login','Erro ao carregar os dados: '+(e.message||e));return}
  $('un').textContent=pf.nome+' · '+(pf.role==='proprietaria'?'proprietária':'recepcionista');
  $('auth').style.display='none';$('ap').value='';$('am').textContent='';render()}
$('lo').onclick=()=>sb.auth.signOut();
if(/error_code=/.test(location.hash)){history.replaceState(null,'',location.pathname);RECOV=false;setMode('login','Link inválido ou expirado. Peça outro em "Esqueci minha senha".')}
sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY'){RECOV=true;setMode('recovery');return}
  if(RECOV)return;
  if(ev==='SIGNED_OUT'){ME=null;appts=[];svcs=[];clis=[];PROFS=[];PU=[];AUS=[];selA=null;selS=null;document.body.classList.remove('rec');render();setMode('login');return}
  if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'){
    if(!s){if(!$('am').textContent)setMode('login');return}
    if(ME&&ME.uid===s.user.id)return;setTimeout(()=>boot(s),0)}});

/* ===== Ausência de profissional ===== */
const MOT=['Doente','Falta','Folga','Férias','Compromisso','Outro'];
function absOn(i,k){return AUS.find(a=>a.prof==i&&a.ini<=k&&k<=a.fim)}
function showAus(i){
  const k=key(cur),f=d=>d.split('-').reverse().join('/'),list=AUS.filter(a=>a.prof==i&&a.fim>=today0).sort((a,b)=>a.ini<b.ini?-1:1);
  P.innerHTML='<h2>Ausência · '+esc(PROFS[i])+'</h2><h3>Marcar como ausente</h3><div class="row"><label>De<input id="ai" type="date" value="'+k+'"></label><label>Até<input id="ai2" type="date" value="'+k+'"></label></div><label>Motivo<select id="am2">'+MOT.map(m=>'<option>'+m+'</option>').join('')+'</select></label><div class="btns"><button onclick="D2.close()">Fechar</button><button class="pri" onclick="saveAus('+i+')">Marcar ausente</button></div><h3>Ausências marcadas</h3><div class="lst">'+(list.map(a=>'<div class="it"><b>'+f(a.ini)+(a.fim!=a.ini?' a '+f(a.fim):'')+'</b><span>'+esc(a.motivo||'—')+'</span><button class="xrm" onclick="delAus('+a.id+','+i+')">Remover</button></div>').join('')||'<p class="mu">Nenhuma ausência futura.</p>')+'</div>';
  if(!D2.open)D2.showModal();
}
function saveAus(i){const a=$('ai').value,b=$('ai2').value;
  if(!a||!b){toast('Informe as datas');return}if(b<a){toast('A data final é anterior à inicial');return}
  AUS.push({id:Date.now(),prof:i,ini:a,fim:b,motivo:$('am2').value});
  const n=appts.filter(x=>x.prof==i&&x.status!='cancelado'&&x.status!='bloqueado'&&x.date>=a&&x.date<=b).length;
  save();render();showAus(i);toast(n?'Ausência marcada. Atenção: '+n+' atendimento(s) já marcado(s) nesse período.':'Ausência marcada')}
function delAus(id,i){AUS=AUS.filter(a=>a.id!=id);save();render();showAus(i);toast('Ausência removida')}

/* ===== Vários clientes no mesmo horário: lado a lado ===== */
function lanes(list){list=list.slice().sort((a,b)=>a.start-b.start||b.dur-a.dur);const out=[];let cl=[],end=0;
  const flush=()=>{const n=Math.max(...cl.map(x=>x.l))+1;cl.forEach(x=>out.push({a:x.a,l:x.l,n}));cl=[]};
  list.forEach(a=>{const e=a.start+a.dur;if(cl.length&&a.start>=end)flush();
    const used=cl.filter(x=>x.a.start+x.a.dur>a.start).map(x=>x.l);let l=0;while(used.includes(l))l++;
    cl.push({a,l});end=cl.length===1?e:Math.max(end,e)});
  if(cl.length)flush();return out}

/* ===== Ordem dos profissionais (arrastar ou ▲▼) ===== */
function moveProf(f,t){
  if(!OWN()){toast('Só a proprietária pode reorganizar os profissionais');return}
  if(f===t)return;
  const order=PROFS.map((_,i)=>i),[x]=order.splice(f,1);order.splice(t,0,x);
  const inv=[];order.forEach((o,n)=>{inv[o]=n});
  PROFS=order.map(o=>PROFS[o]);PU=order.map(o=>PU[o]);
  appts.forEach(a=>{a.prof=inv[a.prof]});AUS.forEach(a=>{a.prof=inv[a.prof]});
  selS=null;save();render();showPro(-1)}
let dragK=null;
P.addEventListener('click',e=>{const m=e.target.closest('.mv');if(!m)return;e.stopPropagation();e.preventDefault();
  const k=+m.closest('.it').dataset.k,t=k+ +m.dataset.d;if(t>=0&&t<PROFS.length)moveProf(k,t)},true);
P.addEventListener('dragstart',e=>{const it=e.target.closest('.it[data-k]');if(it){dragK=+it.dataset.k;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragK))}});
P.addEventListener('dragover',e=>{const it=e.target.closest('.it[data-k]');if(it&&dragK!==null){e.preventDefault();P.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));it.classList.add('drop')}});
P.addEventListener('drop',e=>{const it=e.target.closest('.it[data-k]');if(it&&dragK!==null){e.preventDefault();const t=+it.dataset.k,f=dragK;dragK=null;moveProf(f,t)}});
P.addEventListener('dragend',()=>{dragK=null;P.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'))});
</script>
